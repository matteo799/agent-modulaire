# Configuration de l'éval (M6.5).
# Le runner `python -m rag.evaluation.run` lit ce fichier par défaut.
# La CI compare les scores agrégés aux thresholds ci-dessous et fail si on
# régresse en dessous. Augmenter un threshold = engagement à le maintenir.

golden_set: tests/fixtures/golden/golden_v1.yaml

retrieval:
  k: 5
  thresholds:
    hit_rate: 0.50      # ≥ 50 % des items trouvent au moins un chunk attendu
    mean_recall: 0.40
    mrr: 0.30

citation:
  thresholds:
    precision: 0.60
    recall: 0.50
    f1: 0.55

ragas:
  # Off par défaut : RAGAS coûte cher (1 appel LLM par métrique par item).
  # On l'active uniquement lors des passes longues (`make eval-full`).
  enabled: false
  thresholds:
    faithfulness: 0.65
    answer_relevancy: 0.65

report:
  output: eval_report.md
