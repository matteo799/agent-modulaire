[project]
name = "rag-engine"
version = "0.1.0"
description = "Moteur RAG modulaire Parent-Child + Corrective RAG (réutilisable, une collection par dataset)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Matteo Lambert", email = "matteo.lambert@icloud.com" }]
license = { text = "Proprietary" }

# Runtime deps are split into "core" (always needed) and optional extras
# so contributors don't pay for what they don't use. Heavy ML libs are extras.
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "typer>=0.12",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "tenacity>=8.2",
    "python-multipart>=0.0.9",  # requis par FastAPI pour POST /ingest (multipart file upload)
]

[project.optional-dependencies]
parsers = [
    "pymupdf>=1.24",
    "unstructured[pdf]>=0.13",
    "pdfplumber>=0.11",
]
embeddings = [
    "sentence-transformers>=2.7",
    "torch>=2.2",
]
qdrant = ["qdrant-client>=1.9"]
bm25 = ["rank-bm25>=0.2"]
langgraph = [
    "langchain>=0.2",
    "langgraph>=0.0.50",
    "langchain-community>=0.2",
    "jinja2>=3.1",  # used by rag.prompts to render *.j2 templates (CRAG nodes)
]
observability = ["langfuse>=2.0,<3"]  # callback handler langchain compatible
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "ipykernel>=6.29",
    "types-PyYAML>=6.0",
]

[project.scripts]
rag = "rag.api.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "SIM"]
ignore = ["E501"]  # let formatter handle line length

[tool.ruff.lint.per-file-ignores]
# B011: bare `assert` is fine in tests
# E402: tests routinely `pytest.importorskip(...)` before importing optional deps;
#       this legitimately puts module-level imports after a statement
"tests/*" = ["B011", "E402"]
# B008: FastAPI's Depends/File/Form must appear in function default arguments —
#       that is the correct pattern; suppressing here avoids false positives.
"src/rag/api/routes/*" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true  # many ML libs are untyped

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
markers = [
    "integration: tests that hit a running service (Qdrant, Ollama)",
    "slow: tests that take >5s",
]
