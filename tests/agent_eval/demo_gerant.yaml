version: "demo-gerant-v1.2"
description: |
  Démo « du point de vue d'un GÉRANT DE FONDS » — sur de vrais ISIN du dataset
  Amundi (documents/amundi/). Conçue pour VENDRE *rating fund* : elle déroule le
  workflow réel d'un gérant et montre l'agent en autonomie —
    • due diligence factuelle (fund_summary : SFDR, SRI, benchmark, frais, gérant…)
    • profil risque/rendement complet calculé sur l'historique NAV (fund_stats)
    • performance par période — YTD / 1 an / 3 ans / 5 ans (fund_performance)
    • screening / palmarès multi-fonds (screen_funds)
    • ratio précis (metric_*) et sélection par intention client (clarification)
    • comparaison de fonds, recommandation d'adéquation
    • garde-fous & anti-hallucination (fonds sans historique, ISIN inexistant,
      champ absent type note Morningstar, surperformance non calculable)
    • recherche d'un fonds par son NOM (find_fund) + désambiguïsation des parts
    • valeur d'un investissement dans le temps (invested_value)
    • comparaison multi-critères en un appel (compare_funds)
    • analyse temporelle : rendements calendaires, période datée (Covid, 2022),
      stats mensuelles, temps sous l'eau, Sharpe glissant (fund_calendar/period/
      monthly/underwater/rolling_sharpe)
    • risque fin : VaR 95/99, skewness, kurtosis (fund_tail_risk) ; corrélation
      multi-fonds (funds_correlation) ; audit de la série NAV (fund_nav_series) ;
      impact des frais dans le temps (fees_projection)
    • limites assumées (hors périmètre : alpha/tracking error vs indice, holdings/
      secteur, ESG profond, duration crédit) — l'agent cadre et refuse d'inventer
    40 questions au total.

  Casting (réel, varié) :
    FR0011223569  actions micro-caps eurozone  (Art 6, SRI 3 — offensif, vol élevée)
    LU1882473009  obligataire corporate euro   (Art 8, SRI 2)
    LU1882469403  obligataire aggregate euro   (Art 8, SRI 2)
    FR0011585629  diversifié climat            (Art 8, SRI 3)
    LU0568620214  monétaire EUR                (Art 8, SRI 1 — le refuge)
    FR0010655704  (fonds SANS historique NAV — garde-fou attendu sur les métriques)

  Lancer : python tests/agent_eval/run_golden.py demo_gerant.yaml

items:
# ── A. Due diligence factuelle (fund_summary) ─────────────────────────────
  - id: g01-fiche-esg
    category: fiche
    question: "Pour le fonds FR0011223569 : quelle est sa classification SFDR, son indicateur de risque SRI et son indice de référence ?"
    expected_tools: [fund_summary]
    expected_answer: |
      SFDR (Art. 6/8/9), SRI sur 7, et l'indice de référence, lus dans la fiche.
    tags: [factuel, esg, risque]

  - id: g02-frais
    category: fiche
    question: "Quels sont les frais du fonds FR0011223569 : frais d'entrée, frais courants et commission de surperformance ?"
    expected_tools: [fund_summary]
    expected_answer: |
      Frais d'entrée (~5 %), frais courants (~1,3 %), commission de surperformance,
      tels qu'indiqués dans la fiche (bloc costs).
    tags: [factuel, frais]

  - id: g03-gouvernance
    category: fiche
    question: "Qui est le gérant et le dépositaire du fonds LU1882473009, et quelle est sa date de création ?"
    expected_tools: [fund_summary]
    expected_answer: |
      Nom du gérant, du dépositaire et date de création, depuis la fiche.
    tags: [factuel, gouvernance]

  - id: g04-caracteristiques
    category: fiche
    question: "Donne la classe d'actifs, la devise, la durée de placement recommandée et l'encours du fonds FR0011585629."
    expected_tools: [fund_summary]
    expected_answer: |
      Classe d'actifs, devise, durée recommandée et encours (AUM), depuis la fiche.
    tags: [factuel, caracteristiques]

# ── B. Profil risque/rendement complet (fund_stats) ───────────────────────
  - id: g05-profil-complet
    category: profil
    question: "Donne-moi le profil risque/rendement complet du fonds FR0011223569 (taux sans risque 2 %)."
    expected_tools: [fund_stats]
    expected_answer: |
      Panorama calculé sur l'historique NAV : rendement annualisé, volatilité,
      Sharpe, Sortino, STARR, Martin, max drawdown, CVaR.
    tags: [profil, metriques, nav]

  - id: g06-vol-drawdown
    category: profil
    question: "Quelle est la volatilité annualisée et le drawdown maximal historique du fonds FR0011223569 ?"
    expected_tools: [fund_stats]
    expected_answer: |
      Volatilité annualisée et max drawdown (le fonds micro-caps a un drawdown élevé),
      calculés sur la NAV.
    tags: [profil, volatilite, drawdown]

# ── C. Ratio précis (metric_*) ────────────────────────────────────────────
  - id: g07-sharpe
    category: metrique
    question: "Quel est le ratio de Sharpe du fonds FR0011223569 avec un taux sans risque de 2 % ?"
    expected_tools: [metric_sharpe]
    expected_answer: |
      Sharpe calculé sur l'historique NAV (valeur numérique, rf=2 %).
    tags: [metrique, sharpe, nav]

  - id: g08-sortino
    category: metrique
    question: "Calcule le ratio de Sortino du fonds LU1882473009 (taux sans risque 2 %)."
    expected_tools: [metric_sortino]
    expected_answer: |
      Sortino calculé sur l'historique NAV (≈ -0,30 pour ce fonds, rf=2 %).
    tags: [metrique, sortino, nav]

# ── D. Sélection par intention client (select → metric_*) ─────────────────
  - id: g09-intention-baisse
    category: selection
    question: "J'ai un client qui craint surtout les baisses, sans vouloir pénaliser les hausses. Quelle métrique utiliser pour évaluer le fonds FR0011223569, et quelle est sa valeur ?"
    expected_tools: [metric_sortino]
    expected_answer: |
      Oriente vers Sortino (risque de baisse) et en donne la valeur calculée.
    tags: [selection, sortino, intention]

  - id: g10-intention-queue
    category: selection
    question: "Pour un client obsédé par les pertes extrêmes, quelle métrique privilégier sur LU1882473009 et que vaut-elle ?"
    expected_tools: [metric_starr]
    expected_answer: |
      Oriente vers STARR (rendement / CVaR, risque de queue) et en donne la valeur.
    tags: [selection, starr, queue]

  - id: g11-intention-regularite
    category: selection
    question: "Un client veut un fonds régulier, qui minimise le temps passé sous l'eau. Quelle métrique sur FR0011585629, et sa valeur ?"
    expected_tools: [metric_martin]
    expected_answer: |
      Oriente vers Martin (rendement / Ulcer, régularité des drawdowns) + valeur.
    tags: [selection, martin, drawdown]

  - id: g12-ambigu
    category: selection
    question: "Quelle est la meilleure métrique rendement/risque pour juger le fonds FR0011223569 ?"
    expected_tools: []
    expected_answer: |
      Ambiguïté (Sharpe vs Sortino) → l'agent demande une clarification au lieu de trancher.
    tags: [selection, clarification, ambigu]

# ── E. Comparaison de fonds ───────────────────────────────────────────────
  - id: g13-compare-sharpe
    category: comparaison
    question: "Compare le ratio de Sharpe (rf 2 %) du fonds actions FR0011223569 et du fonds monétaire LU0568620214 : lequel offre le meilleur rapport rendement/risque ?"
    expected_tools: [metric_sharpe]
    expected_answer: |
      Sharpe de CHAQUE fonds (calculés sur leurs NAV), puis désignation du meilleur.
    tags: [comparaison, sharpe, multi-fonds]

  - id: g14-compare-sortino
    category: comparaison
    question: "Entre LU1882473009 et LU1882469403, lequel a le meilleur ratio de Sortino (rf 2 %) ?"
    expected_tools: [metric_sortino]
    expected_answer: |
      Sortino des deux fonds + le meilleur.
    tags: [comparaison, sortino, multi-fonds]

  - id: g15-compare-frais
    category: comparaison
    question: "Compare les frais courants des fonds FR0011223569 et FR0011585629, et donne l'écart."
    expected_tools: [fund_summary, calculator]
    expected_answer: |
      Frais courants de chacun (via fund_summary) puis l'écart via calculator.
    tags: [comparaison, frais, calculator]

# ── F. Adéquation / recommandation ────────────────────────────────────────
  - id: g16-adequation-defensif
    category: adequation
    question: "Le fonds FR0011223569 convient-il à un client défensif ? Justifie avec son indicateur de risque SRI, sa volatilité et son drawdown maximal."
    expected_tools: [fund_summary, fund_stats]
    expected_answer: |
      Recommandation argumentée : SRI (fiche) + volatilité et max drawdown (NAV).
      Conclusion attendue : peu adapté à un défensif (micro-caps, drawdown ~40 %).
    tags: [adequation, recommandation]

  - id: g17-adequation-tresorerie
    category: adequation
    question: "Le fonds LU0568620214 est-il adapté à un placement de trésorerie court terme ? Appuie-toi sur son SRI, sa durée de placement recommandée et sa volatilité."
    expected_tools: [fund_summary, fund_stats]
    expected_answer: |
      SRI (1, faible) + durée recommandée + volatilité faible → cohérent avec une
      poche de trésorerie ; mention du rendement actuel.
    tags: [adequation, tresorerie]

# ── G. Garde-fous honnêtes ────────────────────────────────────────────────
  - id: g18-sans-historique
    category: gardefou
    question: "Donne la classification SFDR et le ratio de Sortino du fonds FR0010655704."
    expected_tools: [fund_summary]
    expected_answer: |
      SFDR depuis la fiche ; pour le Sortino, garde-fou honnête : pas d'historique NAV
      pour ce fonds → aucune valeur inventée.
    tags: [gardefou, no-hallucination]

  - id: g19-isin-inexistant
    category: gardefou
    question: "Quel est le profil risque/rendement du fonds ZZ0000000000 ?"
    expected_tools: []
    expected_answer: |
      Refus honnête : cet ISIN n'existe pas dans le dataset → aucune donnée, rien d'inventé.
    tags: [gardefou, refus]

# ── H. Performance par période (fund_performance) ─────────────────────────
  - id: g20-perf-periodes
    category: performance
    question: "Quelle est la performance du fonds FR0011223569 sur l'année en cours (YTD), 1 an et 3 ans ?"
    expected_tools: [fund_performance]
    expected_answer: |
      Performance cumulée ET annualisée par fenêtre (YTD, 1 an, 3 ans), calculée
      sur l'historique NAV.
    tags: [performance, periodes, nav]

  - id: g21-perf-5ans
    category: performance
    question: "Donne le rendement annualisé du fonds LU1882473009 sur 5 ans et depuis sa création."
    expected_tools: [fund_performance]
    expected_answer: |
      Rendement annualisé sur 5 ans et sur tout l'historique (depuis création).
    tags: [performance, long-terme, nav]

# ── I. Screening / palmarès multi-fonds (screen_funds) ────────────────────
  - id: g22-screening
    category: screening
    question: "Quels sont les 5 fonds actions classés Article 8 ayant le meilleur ratio de Sortino (taux sans risque 2 %) ?"
    expected_tools: [screen_funds]
    expected_answer: |
      Un classement (top 5) des fonds actions SFDR Art. 8 par Sortino, avec ISIN,
      valeur et nom — issu d'un screening sur le dataset.
    tags: [screening, palmares, multi-fonds]

# ── J. Anti-hallucination (champ absent / non calculable) ─────────────────
  - id: g23-champ-absent
    category: anti-hallucination
    question: "Quelle est la note Morningstar et le nombre d'étoiles du fonds FR0011223569 ?"
    expected_tools: [fund_summary]
    expected_answer: |
      La note Morningstar / les étoiles NE figurent PAS dans la fiche → l'agent doit
      dire que l'information n'est pas disponible, SANS inventer d'étoiles. Il peut
      proposer les champs réellement présents (SFDR, SRI…).
    tags: [anti-hallucination, champ-absent]

  - id: g24-surperformance-non-calculable
    category: anti-hallucination
    question: "De combien le fonds LU1882473009 a-t-il battu son indice de référence sur 1 an ?"
    expected_tools: []
    expected_answer: |
      On dispose du NOM du benchmark et de la performance du fonds, mais PAS de la
      série de l'indice → la surperformance n'est pas calculable. L'agent doit le
      dire honnêtement (et peut donner la performance du fonds), SANS fabriquer un
      écart de surperformance.
    tags: [anti-hallucination, benchmark, non-calculable]

# ── K. Recherche par nom, valeur investie, comparaison (outils v1.1) ───────
  - id: g25-recherche-par-nom
    category: recherche
    question: "Parle-moi du fonds Amundi Actions France Responsable."
    expected_tools: [find_fund]
    expected_answer: |
      Le client désigne le fonds par son NOM (pas un ISIN) → l'agent doit d'abord
      résoudre l'ISIN via find_fund. Ce nom couvre PLUSIEURS parts → l'agent doit
      lister les parts (ISIN + libellé) et demander laquelle, SANS en choisir une
      au hasard ni inventer un ISIN.
    tags: [find_fund, resolution-nom, desambiguisation]

  - id: g26-valeur-investie
    category: simulation
    question: "Combien valent aujourd'hui 10 000 € investis il y a 3 ans dans le fonds FR0011223569 ?"
    expected_tools: [invested_value]
    expected_answer: |
      Valeur actuelle de 10 000 € placés il y a 3 ans, calculée sur l'historique
      NAV : montant final, plus/moins-value et rendement (cumulé + annualisé). Le
      montant ne doit PAS être déformé (10 000 reste 10 000, pas 100).
    tags: [invested_value, simulation, nav]

  - id: g27-comparaison-complete
    category: comparaison
    question: "Compare les fonds FR0011223569 et LU1882473009 : rendement, volatilité, Sharpe, Sortino, max drawdown et frais courants."
    expected_tools: [compare_funds]
    expected_answer: |
      Un tableau côte à côte des deux fonds (rendement annualisé, volatilité,
      Sharpe, Sortino, max drawdown, frais courants), calculé sur la NAV + lu dans
      les fiches, en un seul appel compare_funds.
    tags: [compare_funds, comparaison, multi-fonds]

# ── L. Analyse temporelle, risque fin, frais (outils v1.2) ────────────────
  - id: g28-correlation
    category: correlation
    question: "Quelle est la corrélation entre le fonds actions FR0011223569 et le fonds monétaire LU0568620214 ?"
    expected_tools: [funds_correlation]
    expected_answer: |
      Corrélation des rendements quotidiens sur les dates communes. Attendu : très
      faible (actions vs monétaire ≈ 0) → bonne diversification.
    tags: [correlation, diversification, multi-fonds]

  - id: g29-rendements-calendaires
    category: temporel
    question: "Donne-moi les rendements année par année (calendaires) du fonds FR0011223569."
    expected_tools: [fund_calendar]
    expected_answer: |
      Un rendement par année civile (2016, 2017… 2026), calculé sur la NAV — pas
      seulement la performance sur l'historique complet.
    tags: [calendaire, temporel, nav]

  - id: g30-regime-marche
    category: temporel
    question: "Comment le fonds FR0011223569 s'est-il comporté en 2022 (hausse des taux) et pendant le krach Covid (19 février → 23 mars 2020) ?"
    expected_tools: [fund_period]
    expected_answer: |
      Deux rendements de période datée : l'année 2022 entière et la fenêtre Covid
      (fév→mars 2020), calculés sur la NAV. Met en évidence le comportement en
      régime de stress.
    tags: [periode, regime, stress, nav]

  - id: g31-stats-mensuelles
    category: temporel
    question: "Quel est le meilleur et le pire mois du fonds FR0011223569, et son pourcentage de mois positifs ?"
    expected_tools: [fund_monthly]
    expected_answer: |
      Meilleur mois, pire mois, % de mois positifs et mois moyen, depuis les
      rendements mensuels reconstruits sur la NAV.
    tags: [mensuel, regularite, nav]

  - id: g32-temps-sous-leau
    category: temporel
    question: "Combien de temps le fonds FR0011223569 a-t-il mis à récupérer son drawdown maximal (temps sous l'eau) ?"
    expected_tools: [fund_underwater]
    expected_answer: |
      Max drawdown + durée de la plus longue phase sous l'eau (en jours) et si le
      fonds a récupéré son plus-haut — calculé sur la NAV.
    tags: [drawdown, temps-sous-leau, nav]

  - id: g33-sharpe-glissant
    category: profil
    question: "Le ratio de Sharpe du fonds FR0011223569 est-il stable ou erratique ? Donne le Sharpe glissant sur 12 mois."
    expected_tools: [fund_rolling_sharpe]
    expected_answer: |
      Sharpe glissant (fenêtre ~252 j) : moyenne, écart-type (= stabilité), min/max
      et dernière valeur. Un écart-type élevé = Sharpe erratique.
    tags: [sharpe-glissant, stabilite, nav]

  - id: g34-risque-queue
    category: profil
    question: "Quels sont la VaR à 95 % et à 99 %, la skewness et la kurtosis des rendements du fonds FR0011223569 ?"
    expected_tools: [fund_tail_risk]
    expected_answer: |
      VaR 95 % et 99 % (quantiles de perte), CVaR 5 %, skewness (asymétrie, < 0 =
      queue gauche épaisse) et kurtosis excédentaire (> 0 = queues épaisses).
    tags: [var, skewness, kurtosis, risque-queue]

  - id: g35-audit-nav
    category: audit
    question: "Montre-moi la série NAV exacte utilisée pour le fonds FR0011223569 : combien de points, sur quelle plage, et un échantillon."
    expected_tools: [fund_nav_series]
    expected_answer: |
      Données NAV brutes : nombre de points, plage de dates, NAV min/max et un
      échantillon (premières/dernières valeurs) — auditabilité de la source.
    tags: [audit, nav, transparence]

  - id: g36-impact-frais
    category: frais
    question: "Quel est l'impact des frais courants du fonds FR0011223569 sur 10 ans pour un placement de 100 000 € ?"
    expected_tools: [fees_projection]
    expected_answer: |
      Coût cumulé des frais courants sur 10 ans (frais récurrents seuls, hors
      performance et hors frais d'entrée) en euros et en % du capital.
    tags: [frais, projection, cout-reel]

# ── M. Limites assumées : hors périmètre (NAV + faits seulement) ──────────
  - id: g37-alpha-tracking-error
    category: hors-perimetre
    question: "Quel est l'alpha et la tracking error du fonds LU1882473009 par rapport à son indice de référence sur 1 an ?"
    expected_tools: []
    expected_answer: |
      HORS PÉRIMÈTRE : on connaît le NOM de l'indice mais PAS sa série de
      rendements → alpha, tracking error, bêta, information ratio NE sont PAS
      calculables. L'agent doit le dire clairement, SANS inventer de chiffre.
    tags: [hors-perimetre, benchmark, anti-hallucination]

  - id: g38-composition-holdings
    category: hors-perimetre
    question: "Quelles sont les 10 principales positions (titres en portefeuille) du fonds FR0011223569 et sa répartition sectorielle ?"
    expected_tools: []
    expected_answer: |
      HORS PÉRIMÈTRE : le dataset contient la NAV et des faits structurés, PAS les
      positions/holdings ni la ventilation sectorielle. L'agent doit cadrer son
      périmètre (analyse quantitative de performance, pas analyse de portefeuille).
    tags: [hors-perimetre, holdings, composition]

  - id: g39-esg-profond
    category: hors-perimetre
    question: "Quel est le pourcentage d'investissement durable, l'alignement taxonomie et l'intensité carbone du fonds FR0011585629 (Article 8) ?"
    expected_tools: []
    expected_answer: |
      HORS PÉRIMÈTRE : la fiche donne la classification SFDR (Art. 8) mais PAS le
      détail ESG (taxonomie, PAI, intensité carbone, exclusions). L'agent doit le
      dire, sans fabriquer de pourcentages.
    tags: [hors-perimetre, esg, sfdr]

  - id: g40-duration-credit
    category: hors-perimetre
    question: "Quelle est la duration et la qualité de crédit moyenne du fonds obligataire LU1882473009 ?"
    expected_tools: []
    expected_answer: |
      HORS PÉRIMÈTRE : duration, sensibilité et notation crédit moyenne ne figurent
      pas dans les données (NAV + faits généraux). L'agent doit le dire honnêtement.
    tags: [hors-perimetre, obligataire, duration]
